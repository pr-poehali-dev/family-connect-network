version: '3.9'

services:

  db:
    image: postgres:15-alpine
    container_name: myapp_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-myapp_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Укажи DB_PASSWORD в файле .env}
      POSTGRES_DB: ${DB_NAME:-myapp_db}
      ADMIN_NAME: ${ADMIN_NAME:-Администратор}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./docker/create_admin.sh:/docker-entrypoint-initdb.d/02_create_admin.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-myapp_user} -d ${DB_NAME:-myapp_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend/api
      dockerfile: ../../docker/Dockerfile.api
    container_name: myapp_api
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER:-myapp_user}:${DB_PASSWORD}@db:5432/${DB_NAME:-myapp_db}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: myapp_frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db_data: